<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crossed Signals</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f8f8f6;color:#1a1a1a;padding:1.5rem 1rem 3rem;}
.puzzle-wrap{display:flex;flex-direction:column;gap:1.5rem;max-width:980px;margin:0 auto;user-select:none}
.brain-section{position:relative;padding:2rem 1.5rem 1.5rem;border-radius:28px;overflow:visible}
.brain-bg{position:absolute;inset:-18px;width:calc(100% + 36px);height:calc(100% + 36px);pointer-events:none;overflow:visible}
.brain-content{position:relative;z-index:1}
.side-header{font-size:15px;font-weight:500;margin-bottom:12px}
.buckets-and-ops{display:flex;align-items:flex-start;gap:0}
.bucket-op{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 4px;padding-top:42px;font-size:18px;font-weight:700;color:#555;flex-shrink:0;min-width:24px}
.bucket-wrap{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0}
.bucket-num{font-size:13px;font-weight:500;color:#1a1a1a;text-align:center;padding-bottom:6px;line-height:1}
.bucket-rim{width:100%;height:12px;border-bottom:none;border-radius:6px 6px 0 0;transition:background .15s,border-color .15s}
.bucket-body{width:100%;min-height:80px;border-top:none;border-radius:0 0 14px 14px;padding:6px 4px 10px;display:flex;flex-direction:column;gap:4px;align-items:center;transition:background .15s,border-color .15s}
.bucket-pink .bucket-rim{background:#fce8f0;border:1.5px solid #d4537e;border-bottom:none}
.bucket-pink .bucket-body{background:#fce8f0;border:1.5px solid #d4537e;border-top:none}
.bucket-pink .bucket-body.over{background:#f7c5d9;border-color:#a0235e}
.bucket-pink .bucket-rim.over-rim{background:#f7c5d9;border-color:#a0235e}
.bucket-blue .bucket-rim{background:#ddeeff;border:1.5px solid #378ADD;border-bottom:none}
.bucket-blue .bucket-body{background:#ddeeff;border:1.5px solid #378ADD;border-top:none}
.bucket-blue .bucket-body.over{background:#b8d8f8;border-color:#0C447C}
.bucket-blue .bucket-rim.over-rim{background:#b8d8f8;border-color:#0C447C}
.eq-result{display:flex;align-items:center;padding-top:42px;font-size:16px;font-weight:700;color:#1a1a1a;white-space:nowrap;padding-left:6px;flex-shrink:0}
.eq-answer-num{font-size:20px;font-weight:800;margin-left:4px}
.bucket-label-below{font-size:9px;font-weight:400;color:#555;text-align:center;margin-top:5px;line-height:1.3;padding:0 2px}
.tray{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;background:rgba(255,255,255,0.6);border-radius:10px;border:1px solid #ddd;min-height:52px;align-items:center;margin-top:10px}
.bead{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:42px;height:46px;border-radius:10px;font-size:9px;font-weight:700;cursor:grab;border:2px solid transparent;transition:opacity .15s,transform .1s;flex-shrink:0;text-align:center;line-height:1.2;padding:4px 6px 3px;white-space:nowrap}
.bead:active{cursor:grabbing;transform:scale(1.08)}
.bead-code{font-size:11px;font-weight:400;margin-top:2px;letter-spacing:.02em}
.bead-pink{background:#fce8f0;border-color:#d4537e;color:#72243E}
.bead-blue{background:#ddeeff;border-color:#378ADD;color:#0C447C}
.divider{height:1px;background:#ddd}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font-size:13px;padding:6px 14px;border-radius:8px;border:1px solid #bbb;background:#fff;color:#1a1a1a;cursor:pointer}
button:hover{background:#f0f0ee}
.check-btn{background:#ddeeff;color:#0C447C;border-color:#85B7EB}
.check-btn:hover{background:#cce0f5}
.feedback{font-size:14px;font-weight:500}
.correct{color:#2a7a2a}
.wrong{color:#c0392b}
.calc-wrap{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px 16px;max-width:340px}
.calc-title{font-size:11px;font-weight:500;color:#888;letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px}
.calc-tabs{display:flex;gap:6px;margin-bottom:10px}
.calc-tab{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid #ddd;background:#f8f8f6;cursor:pointer;color:#555}
.calc-tab.active-pink{background:#fce8f0;border-color:#d4537e;color:#72243E;font-weight:600}
.calc-tab.active-blue{background:#ddeeff;border-color:#378ADD;color:#0C447C;font-weight:600}
.calc-eq{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.calc-input{width:52px;height:30px;border-radius:6px;border:1px solid #ccc;text-align:center;font-size:13px;font-weight:700;color:#1a1a1a;background:#f8f8f6}
.calc-input:focus{outline:none;border-color:#378ADD}
.calc-op{font-size:15px;font-weight:600;color:#555}
.calc-result-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.calc-result{font-size:22px;font-weight:800;color:#1a1a1a;min-width:70px}
.calc-result.match-pink{color:#d4537e}
.calc-result.match-blue{color:#378ADD}
.calc-hint{font-size:11px;color:#888}
</style>
</head>
<body>
<div class="puzzle-wrap">

  <!-- SIDE 1: pink buckets, blue beads -->
  <div class="brain-section" id="side1-section">
    <svg class="brain-bg" viewBox="0 0 900 300" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="100%" height="100%" rx="32" ry="32" fill="#fce8f0" stroke="#d4537e" stroke-width="2" opacity="0.85"/>
      <!-- brain hemisphere bumps top -->
      <ellipse cx="28%" cy="4" rx="14%" ry="22" fill="#fce8f0" stroke="#d4537e" stroke-width="2" opacity="0.85"/>
      <ellipse cx="50%" cy="2" rx="13%" ry="20" fill="#fce8f0" stroke="#d4537e" stroke-width="2" opacity="0.85"/>
      <ellipse cx="72%" cy="4" rx="14%" ry="22" fill="#fce8f0" stroke="#d4537e" stroke-width="2" opacity="0.85"/>
      <!-- brain fissure line top center -->
      <line x1="50%" y1="2%" x2="50%" y2="18%" stroke="#d4537e" stroke-width="1.5" opacity="0.4"/>
      <!-- bottom bumps -->
      <ellipse cx="28%" cy="100%" rx="13%" ry="20" fill="#fce8f0" stroke="#d4537e" stroke-width="2" opacity="0.85"/>
      <ellipse cx="50%" cy="100%" rx="12%" ry="18" fill="#fce8f0" stroke="#d4537e" stroke-width="2" opacity="0.85"/>
      <ellipse cx="72%" cy="100%" rx="13%" ry="20" fill="#fce8f0" stroke="#d4537e" stroke-width="2" opacity="0.85"/>
    </svg>
    <div class="brain-content">
      <div class="side-header" style="color:#72243E">Side 1</div>
      <div class="buckets-and-ops" id="top-buckets-row"></div>
      <div class="tray" id="top-tray"></div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- SIDE 2: blue buckets, pink beads -->
  <div class="brain-section" id="side2-section">
    <svg class="brain-bg" viewBox="0 0 900 300" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="100%" height="100%" rx="32" ry="32" fill="#ddeeff" stroke="#378ADD" stroke-width="2" opacity="0.85"/>
      <ellipse cx="28%" cy="4" rx="14%" ry="22" fill="#ddeeff" stroke="#378ADD" stroke-width="2" opacity="0.85"/>
      <ellipse cx="50%" cy="2" rx="13%" ry="20" fill="#ddeeff" stroke="#378ADD" stroke-width="2" opacity="0.85"/>
      <ellipse cx="72%" cy="4" rx="14%" ry="22" fill="#ddeeff" stroke="#378ADD" stroke-width="2" opacity="0.85"/>
      <line x1="50%" y1="2%" x2="50%" y2="18%" stroke="#378ADD" stroke-width="1.5" opacity="0.4"/>
      <ellipse cx="28%" cy="100%" rx="13%" ry="20" fill="#ddeeff" stroke="#378ADD" stroke-width="2" opacity="0.85"/>
      <ellipse cx="50%" cy="100%" rx="12%" ry="18" fill="#ddeeff" stroke="#378ADD" stroke-width="2" opacity="0.85"/>
      <ellipse cx="72%" cy="100%" rx="13%" ry="20" fill="#ddeeff" stroke="#378ADD" stroke-width="2" opacity="0.85"/>
    </svg>
    <div class="brain-content">
      <div class="side-header" style="color:#0C447C">Side 2</div>
      <div class="buckets-and-ops" id="bot-buckets-row"></div>
      <div class="tray" id="bot-tray"></div>
    </div>
  </div>

  <div class="btn-row">
    <button class="check-btn" onclick="checkAnswers()">Check answers</button>
    <button onclick="resetPuzzle()">Reset</button>
  </div>
  <div class="feedback" id="feedback"></div>

  <!-- CALCULATOR -->
  <div class="calc-wrap">
    <div class="calc-title">Equation solver</div>
    <div class="calc-tabs">
      <div class="calc-tab active-pink" id="tab1" onclick="setCalcSide(1)">Side 1</div>
      <div class="calc-tab" id="tab2" onclick="setCalcSide(2)">Side 2</div>
    </div>
    <div class="calc-eq">
      <input class="calc-input" id="ca" type="number" placeholder="□" oninput="calcUpdate()">
      <span class="calc-op">×</span>
      <input class="calc-input" id="cb" type="number" placeholder="□" oninput="calcUpdate()">
      <span class="calc-op">+</span>
      <input class="calc-input" id="cc" type="number" placeholder="□" oninput="calcUpdate()">
      <span class="calc-op">×</span>
      <input class="calc-input" id="cd" type="number" placeholder="□" oninput="calcUpdate()">
    </div>
    <div class="calc-result-row">
      <span style="font-size:15px;font-weight:600;color:#555">=</span>
      <span class="calc-result" id="calc-result">—</span>
      <span class="calc-hint" id="calc-hint">enter four numbers</span>
    </div>
  </div>

</div>
<script>
const COLORS=[
  {bg:'#EEEDFE',border:'#7F77DD',text:'#3C3489'},
  {bg:'#FAEEDA',border:'#EF9F27',text:'#633806'},
  {bg:'#FAECE7',border:'#D85A30',text:'#712B13'},
  {bg:'#E1F5EE',border:'#1D9E75',text:'#085041'},
  {bg:'#FBEAF0',border:'#D4537E',text:'#72243E'},
  {bg:'#E6F1FB',border:'#378ADD',text:'#0C447C'},
  {bg:'#EAF3DE',border:'#639922',text:'#27500A'},
  {bg:'#FCF0E0',border:'#C4881A',text:'#5A3A04'},
  {bg:'#F0EBF9',border:'#9B6FD4',text:'#4A2480'},
  {bg:'#E0F4F8',border:'#2AABCC',text:'#0A5A70'},
  {bg:'#FFF0E0',border:'#E07820',text:'#6B3300'},
  {bg:'#F5EDE8',border:'#B07060',text:'#5A2810'},
  {bg:'#E8F0E0',border:'#70A040',text:'#2A5010'},
  {bg:'#F0E8F5',border:'#A060C0',text:'#502070'},
  {bg:'#E8F8F0',border:'#28A060',text:'#0A4020'},
  {bg:'#FEF0E8',border:'#D06828',text:'#6A2800'},
  {bg:'#F8F0E0',border:'#B09030',text:'#504000'},
];

const TOP_BEADS=[
  {ci:1, label:'low protein binding',     code:'43'},
  {ci:3, label:'continuous dosing',       code:'67'},
  {ci:4, label:'low molecular weight',    code:'25'},
  {ci:5, label:'low ionization',          code:'38'},
  {ci:8, label:'high protein binding',    code:'11'},
  {ci:10,label:'intermittent dosing',     code:'22'},
  {ci:12,label:'high ionization',         code:'51'},
  {ci:9, label:'higher molecular weight', code:'64'},
];

const BOT_BEADS=[
  {ci:15,label:'ganciclovir',             code:'29'},
  {ci:1, label:'pyrimethamine',           code:'54'},
  {ci:4, label:'micafungin',              code:'36'},
  {ci:11,label:'voriconazole',            code:'71'},
  {ci:5, label:'itraconazole',            code:'12'},
  {ci:2, label:'fluconazole',             code:'21'},
  {ci:13,label:'TMP/SMX',               code:'33'},
  {ci:6, label:'liposomal ampho B',       code:'61'},
  {ci:16,label:'acyclovir',              code:'83'},
  {ci:12,label:'ceftriaxone',             code:'13'},
];

const TOP_BUCKETS=[
  {id:'t1',num:1,label:'Preferred treatment for HHV-6 encephalitis', answerCi:1, answerLabel:'low protein binding'},
  {id:'t2',num:2,label:'Preferred treatment for Toxoplasmosis',       answerCi:3, answerLabel:'continuous dosing'},
  {id:'t3',num:3,label:'Lowest CNS penetration for Candida',          answerCi:4, answerLabel:'low molecular weight'},
  {id:'t4',num:4,label:'Target CNS trough 2-5 mcg/mL',                   answerCi:5, answerLabel:'low ionization'},
];

const BOT_BUCKETS=[
  {id:'b1',num:1,label:'Desired protein binding in CNS',              answerCi:15,answerLabel:'ganciclovir'},
  {id:'b2',num:2,label:'Improves beta-lactam efficacy (T>MIC) in CNS',answerCi:1, answerLabel:'pyrimethamine'},
  {id:'b3',num:3,label:'Desired molecular weight in CNS',             answerCi:4, answerLabel:'micafungin'},
  {id:'b4',num:4,label:'Desired ionization at CNS pH',                answerCi:11,answerLabel:'voriconazole'},
];

const OPS=['×',') + (','×'];
const TOP_SIDE='top', BOT_SIDE='bot';
let _dragCi=null,_dragLabel=null,_dragCode=null,_dragSrcId=null,_dragSide=null,_isDragging=false;

function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function updateEquationBoxes(){
  TOP_BUCKETS.forEach((b,i)=>{
    const body=document.getElementById('top-buckets'+b.id);
    const bead=body?body.querySelector('.bead'):null;
    const box=document.getElementById('eq1-'+i);
    if(box)box.textContent=bead?bead.dataset.code:'?';
  });
  BOT_BUCKETS.forEach((b,i)=>{
    const body=document.getElementById('bot-buckets'+b.id);
    const bead=body?body.querySelector('.bead'):null;
    const box=document.getElementById('eq2-'+i);
    if(box)box.textContent=bead?bead.dataset.code:'?';
  });
}

function makeBead(ci,label,code,side){
  const el=document.createElement('div');
  el.className='bead '+(side===TOP_SIDE?'bead-blue':'bead-pink');
  el.draggable=true;
  el.dataset.ci=ci;el.dataset.label=label;el.dataset.code=code;el.dataset.side=side;el.title=label;
  const n=document.createElement('span');n.textContent=label;
  const cd=document.createElement('span');cd.className='bead-code';cd.textContent=code;
  el.appendChild(n);el.appendChild(cd);
  el.addEventListener('dragstart',e=>{
    _dragCi=ci;_dragLabel=label;_dragCode=code;_dragSrcId=el.parentElement.id;_dragSide=side;
    _isDragging=true;
    e.dataTransfer.setData('text/plain',String(ci));
    setTimeout(()=>el.style.opacity='.3',0);
  });
  el.addEventListener('dragend',()=>{el.style.opacity='1';_isDragging=false;updateEquationBoxes();});
  return el;
}

function setupDrop(el,rim,side,onDrop){
  if(el._dropSetup)return;el._dropSetup=true;
  el.addEventListener('dragover',e=>{if(!_isDragging||_dragSide!==side)return;e.preventDefault();el.classList.add('over');if(rim)rim.classList.add('over-rim');});
  el.addEventListener('dragleave',e=>{if(!el.contains(e.relatedTarget)){el.classList.remove('over');if(rim)rim.classList.remove('over-rim');}});
  el.addEventListener('drop',e=>{
    e.preventDefault();el.classList.remove('over');if(rim)rim.classList.remove('over-rim');
    if(!_isDragging||_dragSide!==side)return;
    _isDragging=false;
    const ci=_dragCi,label=_dragLabel,code=_dragCode,srcId=_dragSrcId,bs=_dragSide;
    if(srcId===el.id)return;
    const src=document.getElementById(srcId);
    if(src){const ex=[...src.querySelectorAll('.bead')].find(b=>parseInt(b.dataset.ci)===ci&&b.dataset.label===label);if(ex)ex.remove();}
    onDrop(ci,label,code,bs,el);
    updateEquationBoxes();
    document.getElementById('feedback').textContent='';
  });
}

function makeBucketEl(b,prefix,side,colorClass,eqBoxId){
  const wrap=document.createElement('div');wrap.className='bucket-wrap '+(colorClass||'');
  const numEl=document.createElement('div');numEl.className='bucket-num';numEl.style.display='none';

  const rim=document.createElement('div');rim.className='bucket-rim';
  const body=document.createElement('div');body.className='bucket-body';body.id=prefix+b.id;
  setupDrop(body,rim,side,(ci,label,code,bs,el)=>el.appendChild(makeBead(ci,label,code,bs)));
  const lbl=document.createElement('div');lbl.className='bucket-label-below';lbl.textContent=b.label;
  wrap.appendChild(numEl);wrap.appendChild(rim);wrap.appendChild(body);wrap.appendChild(lbl);
  return wrap;
}

function buildSide(buckets,beads,rowId,trayId,prefix,side,colorClass,eqPrefix,answerNum){
  const row=document.getElementById(rowId);row.innerHTML='';
  buckets.forEach((b,i)=>{
    if(i===0){
      const open=document.createElement('div');open.className='bucket-op';open.textContent='(';
      row.appendChild(open);
    } else {
      const op=document.createElement('div');op.className='bucket-op';
      op.textContent=OPS[i-1];
      row.appendChild(op);
    }
    row.appendChild(makeBucketEl(b,prefix,side,colorClass,eqPrefix+i));
  });
  // closing paren + equals + answer
  const res=document.createElement('div');res.className='eq-result';
  res.id=eqPrefix+'result';
  res.dataset.answer=answerNum;
  res.innerHTML=') = <span class="eq-answer-num" id="'+eqPrefix+'answernum'+'">?</span>';
  row.appendChild(res);

  const tray=document.getElementById(trayId);tray.innerHTML='';tray._dropSetup=false;
  setupDrop(tray,null,side,(ci,label,code,bs,el)=>el.appendChild(makeBead(ci,label,code,bs)));
  shuffle(beads).forEach(b=>tray.appendChild(makeBead(b.ci,b.label,b.code,side)));
}

function buildTop(){buildSide(TOP_BUCKETS,TOP_BEADS,'top-buckets-row','top-tray','top-buckets',TOP_SIDE,'bucket-pink','eq1-',3831);}
function buildBot(){buildSide(BOT_BUCKETS,BOT_BEADS,'bot-buckets-row','bot-tray','bot-buckets',BOT_SIDE,'bucket-blue','eq2-',4122);}

function revealAnswers(show){
  [['eq1-','3831'],['eq2-','4122']].forEach(([prefix,num])=>{
    const el=document.getElementById(prefix+'answernum');
    if(el) el.textContent=show?num:'?';
  });
}

function checkAnswers(){
  let allCorrect=true;
  function checkSide(buckets,prefix){
    buckets.forEach(b=>{
      const el=document.getElementById(prefix+b.id);
      const placed=[...el.querySelectorAll('.bead')].map(x=>({ci:parseInt(x.dataset.ci),label:x.dataset.label}));
      const hasCorrect=placed.some(p=>p.ci===b.answerCi&&p.label===b.answerLabel);
      const hasWrong=placed.some(p=>!(p.ci===b.answerCi&&p.label===b.answerLabel));
      if(!hasCorrect||hasWrong)allCorrect=false;
    });
  }
  checkSide(TOP_BUCKETS,'top-buckets');checkSide(BOT_BUCKETS,'bot-buckets');
  const fb=document.getElementById('feedback');
  if(allCorrect){
    revealAnswers(true);
    fb.innerHTML='<span class="correct">Correct!</span>';
  } else {
    revealAnswers(false);
    fb.innerHTML='<span class="wrong">Try again!</span>';
  }
}

function resetPuzzle(){buildTop();buildBot();updateEquationBoxes();revealAnswers(false);document.getElementById('feedback').textContent='';}

let calcSide=1;
function setCalcSide(s){
  calcSide=s;
  document.getElementById('tab1').className='calc-tab'+(s===1?' active-pink':'');
  document.getElementById('tab2').className='calc-tab'+(s===2?' active-blue':'');
  ['ca','cb','cc','cd'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('calc-result').textContent='—';
  document.getElementById('calc-result').className='calc-result';
  document.getElementById('calc-hint').textContent='enter four numbers';
}
function calcUpdate(){
  const a=parseFloat(document.getElementById('ca').value);
  const b=parseFloat(document.getElementById('cb').value);
  const c=parseFloat(document.getElementById('cc').value);
  const d=parseFloat(document.getElementById('cd').value);
  const rEl=document.getElementById('calc-result'),hEl=document.getElementById('calc-hint');
  if([a,b,c,d].some(isNaN)){rEl.textContent='—';rEl.className='calc-result';hEl.textContent='enter four numbers';return;}
  const result=a*b+c*d;
  rEl.textContent=result.toLocaleString();
  const target=calcSide===1?3831:4122;
  if(result===target){rEl.className='calc-result '+(calcSide===1?'match-pink':'match-blue');hEl.textContent='✓ matches the target!';}
  else{rEl.className='calc-result';hEl.textContent='target: '+target.toLocaleString()+' · diff: '+(result-target);}
}

buildTop();buildBot();updateEquationBoxes();
</script>
</body>
</html>
