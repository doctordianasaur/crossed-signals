<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crossed Signals</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f8f8f6;color:#1a1a1a;padding:1.5rem 1rem 3rem;}
.puzzle-wrap{display:flex;flex-direction:column;gap:1.25rem;user-select:none;max-width:900px;margin:0 auto}
.side-header{font-size:15px;font-weight:500;color:#1a1a1a;margin-bottom:10px}
.buckets-row{display:flex;gap:8px;align-items:flex-start}
.bucket-wrap{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0}
.bucket-num{font-size:13px;font-weight:500;color:#1a1a1a;text-align:center;padding-bottom:6px;line-height:1}
.bucket-rim{width:100%;height:12px;background:#efefed;border:1.5px solid #ccc;border-bottom:none;border-radius:6px 6px 0 0;transition:background .15s,border-color .15s}
.bucket-body{width:100%;min-height:80px;background:#efefed;border:1.5px solid #ccc;border-top:none;border-radius:0 0 14px 14px;padding:6px 4px 10px;display:flex;flex-direction:column;gap:4px;align-items:center;transition:background .15s,border-color .15s}
.bucket-body.over{background:#ddeeff;border-color:#378ADD}
.bucket-rim.over-rim{background:#ddeeff;border-color:#378ADD}
.bucket-label-below{font-size:9.5px;font-weight:400;color:#666;text-align:center;margin-top:6px;line-height:1.3;padding:0 2px}
.tray{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;background:#efefed;border-radius:10px;border:1px solid #ddd;min-height:52px;align-items:center}
.bead{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:38px;height:44px;border-radius:10px;font-size:9.5px;font-weight:500;cursor:grab;border:2px solid transparent;transition:opacity .15s,transform .1s;flex-shrink:0;text-align:center;line-height:1.2;padding:4px 6px 3px;white-space:nowrap}
.bead:active{cursor:grabbing;transform:scale(1.08)}
.bead-code{font-size:9px;opacity:.65;margin-top:2px;font-weight:400}
.divider{height:1px;background:#ddd}
.btn-row{display:flex;gap:8px}
button{font-size:13px;padding:6px 14px;border-radius:8px;border:1px solid #bbb;background:#fff;color:#1a1a1a;cursor:pointer}
button:hover{background:#f0f0ee}
.check-btn{background:#ddeeff;color:#0C447C;border-color:#85B7EB}
.check-btn:hover{background:#cce0f5}
.feedback{font-size:14px;font-weight:500}
.correct{color:#2a7a2a}
.wrong{color:#c0392b}
</style>
</head>
<body>
<div class="puzzle-wrap">
  <div>
    <div class="side-header">Side 1</div>
    <div class="buckets-row" id="top-buckets"></div>
  </div>
  <div class="tray" id="top-tray"></div>
  <div class="divider"></div>
  <div>
    <div class="side-header">Side 2</div>
    <div class="buckets-row" id="bot-buckets"></div>
  </div>
  <div class="tray" id="bot-tray"></div>
  <div class="btn-row">
    <button class="check-btn" onclick="checkAnswers()">Check answers</button>
    <button onclick="resetPuzzle()">Reset</button>
  </div>
  <div class="feedback" id="feedback"></div>
</div>

<script>
const COLORS=[
  {bg:'#EEEDFE',border:'#7F77DD',text:'#3C3489'},  // ci:0
  {bg:'#FAEEDA',border:'#EF9F27',text:'#633806'},  // ci:1
  {bg:'#FAECE7',border:'#D85A30',text:'#712B13'},  // ci:2
  {bg:'#E1F5EE',border:'#1D9E75',text:'#085041'},  // ci:3
  {bg:'#FBEAF0',border:'#D4537E',text:'#72243E'},  // ci:4
  {bg:'#E6F1FB',border:'#378ADD',text:'#0C447C'},  // ci:5
  {bg:'#EAF3DE',border:'#639922',text:'#27500A'},  // ci:6
  {bg:'#FCF0E0',border:'#C4881A',text:'#5A3A04'},  // ci:7
  {bg:'#F0EBF9',border:'#9B6FD4',text:'#4A2480'},  // ci:8
  {bg:'#E0F4F8',border:'#2AABCC',text:'#0A5A70'},  // ci:9
  {bg:'#FFF0E0',border:'#E07820',text:'#6B3300'},  // ci:10
  {bg:'#F5EDE8',border:'#B07060',text:'#5A2810'},  // ci:11
  {bg:'#E8F0E0',border:'#70A040',text:'#2A5010'},  // ci:12
  {bg:'#F0E8F5',border:'#A060C0',text:'#502070'},  // ci:13
];

// MATCHED PAIRS (answers swapped across sides):
// ci:1  pyrimethamine      / low protein binding
// ci:3  continuous dosing  (vancomycin removed from S2)
// ci:4  micafungin         / low molecular weight
// ci:5  itraconazole       / low ionization
// ci:0  levofloxacin       (lipophilicity removed from S1)

// Side 1 tray: 4 correct PK beads + 4 red herrings = 8 total
// Codes unique per side, digits 0-9
const TOP_BEADS=[
  {ci:1,  label:'low protein binding',      code:'3'},  // correct → bucket 1
  {ci:3,  label:'continuous dosing',        code:'7'},  // correct → bucket 2
  {ci:4,  label:'low molecular weight',     code:'1'},  // correct → bucket 3
  {ci:5,  label:'low ionization',           code:'5'},  // correct → bucket 4
  // red herrings
  {ci:8,  label:'high protein binding',     code:'8'},
  {ci:10, label:'intermittent dosing',      code:'2'},
  {ci:12, label:'high ionization',          code:'6'},
  {ci:9,  label:'higher molecular weight',    code:'4'},
];

// Side 2 tray: 4 correct drug beads + 6 red herrings = 10 total
const BOT_BEADS=[
  {ci:0,  label:'levofloxacin',             code:'9'},  // correct → bucket 1
  {ci:1,  label:'pyrimethamine',            code:'2'},  // correct → bucket 2
  {ci:4,  label:'micafungin',               code:'7'},  // correct → bucket 3
  {ci:5,  label:'itraconazole',             code:'4'},  // correct → bucket 4
  // red herrings
  {ci:2,  label:'fluconazole',              code:'5'},
  {ci:13, label:'TMP/SMX',                 code:'6'},
  {ci:9,  label:'metronidazole',            code:'3'},
  {ci:6,  label:'liposomal ampho B',        code:'8'},
  {ci:11, label:'voriconazole',             code:'1'},
  {ci:12, label:'ceftriaxone',              code:'5'},
];

// Side 1 buckets — accept PK beads only
const TOP_BUCKETS=[
  {id:'t1',num:1,label:'Adjunctive for TB meningitis',        answerCi:1, answerLabel:'low protein binding'},
  {id:'t2',num:2,label:'Toxoplasmosis treatment',             answerCi:3, answerLabel:'continuous dosing'},
  {id:'t3',num:3,label:'Poor CNS penetration for Candida',    answerCi:4, answerLabel:'low molecular weight'},
  {id:'t4',num:4,label:'High P-gp efflux',        answerCi:5, answerLabel:'low ionization'},
];

// Side 2 buckets — accept drug beads only
const BOT_BUCKETS=[
  {id:'b1',num:1,label:'Desired protein binding in CSF',       answerCi:0, answerLabel:'levofloxacin'},
  {id:'b2',num:2,label:'Improves beta-lactam efficacy (T>MIC)',answerCi:1, answerLabel:'pyrimethamine'},
  {id:'b3',num:3,label:'Desired molecular weight in CSF',      answerCi:4, answerLabel:'micafungin'},
  {id:'b4',num:4,label:'Desired ionization at CSF pH',         answerCi:5, answerLabel:'itraconazole'},
];

const TOP_SIDE='top';
const BOT_SIDE='bot';

function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

let _dragCi=null,_dragLabel=null,_dragCode=null,_dragSrcId=null,_dragSide=null,_isDragging=false;

function makeBead(ci,label,code,side){
  const c=COLORS[ci]||COLORS[0];
  const el=document.createElement('div');
  el.className='bead';
  el.style.background=c.bg;el.style.borderColor=c.border;el.style.color=c.text;
  el.draggable=true;el.dataset.ci=ci;el.dataset.label=label;el.dataset.side=side;el.title=label;
  const n=document.createElement('span');n.textContent=label;
  const cd=document.createElement('span');cd.className='bead-code';cd.textContent=code;
  el.appendChild(n);el.appendChild(cd);
  el.addEventListener('dragstart',e=>{
    _dragCi=ci;_dragLabel=label;_dragCode=code;_dragSrcId=el.parentElement.id;_dragSide=side;
    _isDragging=true;
    e.dataTransfer.setData('text/plain',String(ci));
    setTimeout(()=>el.style.opacity='.3',0);
  });
  el.addEventListener('dragend',()=>{el.style.opacity='1';_isDragging=false;});
  return el;
}

function setupDrop(el,rim,side,onDrop){
  if(el._dropSetup)return;
  el._dropSetup=true;
  el.addEventListener('dragover',e=>{
    if(!_isDragging||_dragSide!==side)return;
    e.preventDefault();el.classList.add('over');if(rim)rim.classList.add('over-rim');
  });
  el.addEventListener('dragleave',e=>{if(!el.contains(e.relatedTarget)){el.classList.remove('over');if(rim)rim.classList.remove('over-rim');}});
  el.addEventListener('drop',e=>{
    e.preventDefault();el.classList.remove('over');if(rim)rim.classList.remove('over-rim');
    if(!_isDragging||_dragSide!==side)return;
    _isDragging=false;
    const ci=_dragCi,label=_dragLabel,code=_dragCode,srcId=_dragSrcId,beadSide=_dragSide;
    if(srcId===el.id)return;
    const src=document.getElementById(srcId);
    if(src){const ex=[...src.querySelectorAll('.bead')].find(b=>parseInt(b.dataset.ci)===ci&&b.dataset.label===label);if(ex)ex.remove();}
    onDrop(ci,label,code,beadSide,el);
    document.getElementById('feedback').textContent='';
  });
}

function makeBucketEl(b,prefix,side){
  const wrap=document.createElement('div');wrap.className='bucket-wrap';
  const numEl=document.createElement('div');numEl.className='bucket-num';numEl.textContent=b.num;
  const rim=document.createElement('div');rim.className='bucket-rim';
  const body=document.createElement('div');body.className='bucket-body';body.id=prefix+b.id;
  setupDrop(body,rim,side,(ci,label,code,beadSide,el)=>el.appendChild(makeBead(ci,label,code,beadSide)));
  const lbl=document.createElement('div');lbl.className='bucket-label-below';lbl.textContent=b.label;
  wrap.appendChild(numEl);wrap.appendChild(rim);wrap.appendChild(body);wrap.appendChild(lbl);
  return wrap;
}

function buildTop(){
  const bc=document.getElementById('top-buckets');bc.innerHTML='';
  TOP_BUCKETS.forEach(b=>bc.appendChild(makeBucketEl(b,'top-buckets',TOP_SIDE)));
  const tray=document.getElementById('top-tray');tray.innerHTML='';
  tray._dropSetup=false;
  setupDrop(tray,null,TOP_SIDE,(ci,label,code,beadSide,el)=>el.appendChild(makeBead(ci,label,code,beadSide)));
  shuffle(TOP_BEADS).forEach(b=>tray.appendChild(makeBead(b.ci,b.label,b.code,TOP_SIDE)));
}

function buildBot(){
  const bc=document.getElementById('bot-buckets');bc.innerHTML='';
  BOT_BUCKETS.forEach(b=>bc.appendChild(makeBucketEl(b,'bot-buckets',BOT_SIDE)));
  const tray=document.getElementById('bot-tray');tray.innerHTML='';
  tray._dropSetup=false;
  setupDrop(tray,null,BOT_SIDE,(ci,label,code,beadSide,el)=>el.appendChild(makeBead(ci,label,code,beadSide)));
  shuffle(BOT_BEADS).forEach(b=>tray.appendChild(makeBead(b.ci,b.label,b.code,BOT_SIDE)));
}

function checkAnswers(){
  let allCorrect=true;
  function checkSide(buckets,prefix){
    buckets.forEach(b=>{
      const el=document.getElementById(prefix+b.id);
      const placed=[...el.querySelectorAll('.bead')].map(x=>({ci:parseInt(x.dataset.ci),label:x.dataset.label}));
      const hasCorrect=placed.some(p=>p.ci===b.answerCi&&p.label===b.answerLabel);
      const hasWrong=placed.some(p=>!(p.ci===b.answerCi&&p.label===b.answerLabel));
      if(!hasCorrect||hasWrong)allCorrect=false;
    });
  }
  checkSide(TOP_BUCKETS,'top-buckets');
  checkSide(BOT_BUCKETS,'bot-buckets');
  const fb=document.getElementById('feedback');
  fb.innerHTML=allCorrect
    ?'<span class="correct">Correct!</span>'
    :'<span class="wrong">Try again!</span>';
}

function resetPuzzle(){
  buildTop();buildBot();
  document.getElementById('feedback').textContent='';
}

buildTop();buildBot();
</script>
</body>
</html>
